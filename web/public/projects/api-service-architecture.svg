<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="title desc">
  <title id="title">API service architecture</title>
  <desc id="desc">A client sends requests to an API service, which reads from and writes to a database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="360" fill="#ffffff" />

  <!-- Client box -->
  <rect x="40" y="150" width="180" height="80" rx="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2" />
  <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a1a">Client</text>
  <text x="130" y="207" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">web / mobile / partner</text>

  <!-- API Service box -->
  <rect x="360" y="140" width="200" height="100" rx="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2" />
  <text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a1a">API Service</text>
  <text x="460" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">auth, validation,</text>
  <text x="460" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">rate limiting, caching</text>

  <!-- Database box -->
  <rect x="700" y="150" width="160" height="80" rx="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2" />
  <text x="780" y="185" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#1a1a1a">Database</text>
  <text x="780" y="207" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">reads &amp; writes</text>

  <!-- Arrows -->
  <line x1="220" y1="180" x2="352" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="286" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">request</text>

  <line x1="560" y1="180" x2="692" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="626" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">query</text>

  <line x1="692" y1="210" x2="560" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="626" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">result</text>
</svg>
